<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CuCap</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--tx:#e8eaee;--mut:#8b919d;--ac:#4ade80;--am:#fbbf24;--rd:#f87171;--bl:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 120px}
h1{font-size:19px;margin:4px 0 2px}
.muted{color:var(--mut);font-size:13px}
input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:15px;max-width:100%}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#06220f;border:0;border-radius:9px;padding:10px 14px;font-weight:600}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.rd{background:#3a1d1d;color:var(--rd);border:1px solid #5a2a2a}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.filters input[type=text],.filters input:not([type]){flex:1;min-width:120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:600}
.pr{text-align:right;white-space:nowrap;font-weight:700;font-size:17px}
.pr s{color:var(--mut);font-weight:400;font-size:13px;margin-left:4px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.mx{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:13px;color:var(--mut)}
.mx b{color:var(--tx);font-size:15px}
.bd{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.b{font-size:12px;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--mut)}
.b.g{color:var(--ac);border-color:#1f5a35;background:#102418}
.b.a{color:var(--am);border-color:#5a4513;background:#241d0d}
.b.r{color:var(--rd);border-color:#5a2a2a;background:#241212}
.b.bl{color:var(--bl);border-color:#1e3a5f;background:#0f1a2a}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ed label{font-size:12px;color:var(--mut);display:block}
.ed input{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.field input,.field select{width:100%}
#log{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;max-height:300px;overflow:auto;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222833;border:1px solid var(--line);padding:10px 14px;border-radius:10px;z-index:20;max-width:90%}
.warn{background:#241d0d;border:1px solid #5a4513;color:var(--am);border-radius:10px;padding:10px;margin:8px 0;font-size:13px}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.recipe h3{margin:0 0 4px;font-size:16px}
.recipe ul,.recipe ol{margin:6px 0;padding-left:20px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.usr{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center;padding:0}
.usr svg,nav svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.usr svg{width:18px;height:18px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;align-items:flex-end;background:#13161b;border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;padding:4px 0;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ac);font-weight:500}
nav .midc{width:46px;height:46px;border-radius:50%;background:var(--ac);color:#06220f;display:flex;align-items:center;justify-content:center;margin-top:-22px;border:3px solid var(--bg)}
nav .midc svg{width:22px;height:22px}
.bdg{position:absolute;top:-2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--ac);color:#06220f;font-size:11px;line-height:16px;text-align:center;font-style:normal;padding:0 4px}
.brand{display:flex;align-items:center;gap:8px;margin:4px 0 6px;font-size:24px;letter-spacing:-.02em}
.brand b{color:var(--ac);font-weight:600}
.pg{margin:8px 0}
.shs{font-size:17px;font-weight:600;margin:14px 0 8px}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ct{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 10px;color:var(--tx);text-align:left}
.ct .cv{aspect-ratio:3/4;border-radius:9px;overflow:hidden;background:#1c2330;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:8px}
.ct .cv img{width:100%;height:100%;object-fit:cover;object-position:top}
.ct .cn{font-weight:600;font-size:14px}
.ct.x .cv{opacity:.5}
.rdh{display:flex;align-items:center;gap:10px;margin:10px 0}
.rd{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px;scrollbar-width:none}
.rd::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:0 12px}
.rnav{position:sticky;bottom:84px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:4;pointer-events:none}
.rnav>*{pointer-events:auto}
.rnav span{background:#222833;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
.pgscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:6px 0}
.pgimg{position:relative;width:100%}
.pgimg.z{width:220%}
.pgimg img{display:block;width:100%;height:auto}
.plus,.plus2{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(15,17,21,.88);color:#fff;font-size:20px;line-height:1;padding:0;flex:none}
.plus{position:absolute;transform:translate(-100%,0)}
.plus.on,.plus2.on{background:var(--ac);color:#06220f;border-color:var(--ac)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar div{height:100%;background:var(--ac);transition:width .3s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto}
.lst{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;margin:14px 0}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lst .st{font-weight:700;font-size:20px;letter-spacing:-.2px}
.lst .pd{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--mut);font-size:13px}
.lst .tg{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:#102418;color:var(--ac)}
.lst .tg.x{background:#2a1618;color:var(--rd)}
.lst .tt{text-align:right}.lst .tt b{font-size:22px;font-weight:700;letter-spacing:-.3px}
.lst .tt small{display:block;font-size:12px;color:var(--ac);margin-top:2px}
.pgb{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 10px}
.pgb div{height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.sec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:20px 0 2px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec i{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;color:#7c8494}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.tl{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;display:flex;flex-direction:column;position:relative}
.tl .hd{display:flex;justify-content:space-between;align-items:flex-start}
.tl .em{font-size:24px;line-height:1}
.tl .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid #6b7280;background:none;color:#06220f;font-size:13px;font-weight:700;padding:0;display:flex;align-items:center;justify-content:center}
.tl.dn .ck{background:var(--ac);border-color:var(--ac)}
.tl .nm{font-size:13px;font-weight:500;line-height:1.3;margin:6px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl .pz{margin-top:auto;display:flex;align-items:baseline;gap:4px}
.tl .pz b{font-size:17px;font-weight:600;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.tl .pz small{font-size:11px;color:var(--mut)}
.tl .pz em{font-style:normal;font-size:11px;color:var(--ac);margin-left:auto}
.tl .ft{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.tl .ft .xb{font-size:12px;padding:0 0 0 6px}
.tl.dn .em,.tl.dn .nm,.tl.dn .pz{opacity:.45}
.tl.dn .nm{text-decoration:line-through}
.ph{width:64px;height:64px;border-radius:12px;background:#1c2330;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid #4b5160;background:transparent;color:#06220f;font-size:16px;font-weight:700;padding:0;flex:none;line-height:1}
.chk.on{background:var(--ac);border-color:var(--ac)}
.xb{background:none;border:0;color:#5b6270;font-size:14px;padding:2px 6px}
.tot{display:flex;flex-wrap:wrap;gap:6px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.tot b{font-size:17px}
@media (min-width:900px){
body{font-size:15px}
.wrap{max-width:1280px;margin:0 0 0 232px;padding:28px 36px 48px}
.topbar{position:fixed;left:0;top:0;width:232px;padding:22px 20px;z-index:11}
.usr{display:none}
nav{left:0;top:0;bottom:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;border-top:0;border-right:1px solid var(--line);padding:84px 12px 16px}
nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 12px;border-radius:10px}
nav button:hover{background:#1a1e26;color:var(--tx)}
nav button.on{background:#102418}
nav button svg{width:22px;height:22px}
nav button[data-tab=upload]{order:9;margin-top:14px;background:var(--ac);color:#06220f;font-weight:600;justify-content:center}
nav button[data-tab=upload]:hover{background:#6ee79a;color:#06220f}
nav .midc{width:auto;height:auto;margin:0;border:0;background:none}
.bdg{position:static;margin-left:auto}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
#list .card{margin:0}
.sl{flex-basis:50%}
.rd{margin:0 -8px}
.shelf{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.rnav{position:static;margin-top:8px}
.g2{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.lst{padding:22px 24px 20px}
.field,.filters{max-width:720px}
.toast{bottom:28px}
#installBtn{display:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="brand"><svg width="34" height="34" viewBox="0 0 56 56" aria-hidden="true"><path d="M42 14a20 20 0 1 0 0 28" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/><path d="M22 29l6 6 11-13" fill="none" stroke="#e8eaee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Cu<b>Cap</b></span></div><button class="usr" data-goto="profile" aria-label="Profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg></button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const addDays = (d, n) => { const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); };
const fmtD = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) : '';
const today = () => new Date().toISOString().slice(0, 10);
const num = v => { const n = typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v; return Number.isFinite(n) ? n : null; };
const f1 = v => v == null ? '–' : (Math.round(v * 10) / 10).toString();
const f2 = v => v == null ? '–' : v.toFixed(2);
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const STORES = ['Lidl', 'Kaufland', 'Carrefour', 'Penny', 'Profi', 'Auchan', 'Mega Image', 'Altul'];
const DEF_PROFILE = { kcal: 2200, protein: 150, diet: 'omnivor', exclude: '', minDensity: 6, budget: 250, days: 7 };

const SB_URL = 'https://senwituyejxxkkxukggn.supabase.co', SB_KEY = 'sb_publishable_1-IHJpTJGxPaSDcWg3x_Xg_mvDXeEMZ';
let sb = null, col = null, uid = null, loaded = false, assets = null, cfg = { gkey: '', model: '' }, urlCache = {};
let bsnap = {}, favs = [], products = {}, pages = {}, profile = { ...DEF_PROFILE }, basket = [];
let S = { cat: '', zoom: false, tab: 'offers', f: { sort: 'scor', store: '', q: '', promo: false, fav: false }, runIds: new Set(), open: {}, del: {}, log: [], recipes: '', suggest: '', busy: false, stop: false, files: [], uStore: 'Lidl', uDate: today(), uEnd: addDays(today(), 6), autoDate: true };

let wq = Promise.resolve();
function updBadge() { const b = $('#bdg'); if (b) { b.textContent = basket.length; b.style.display = basket.length ? '' : 'none'; } }
function write(fn) {
  updBadge();
  if (!col) return Promise.resolve();
  wq = wq.then(fn).catch(e => { console.error(e); toast('Eroare salvare: ' + ((e && (e.message || e.code)) || '')); });
  return wq;
}
function toast(msg) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  $('#toastbox').appendChild(d); setTimeout(() => d.remove(), 3500);
}

/* ---------- calcule ---------- */
function calc(x) {
  const h = x.history, cur = h[h.length - 1], prior = h.slice(0, -1);
  const w = x.weight_g, k = x.kcal100, pr = x.protein100;
  const dens = (k > 0 && pr != null) ? pr / k * 100 : null;
  const protPack = (w && pr != null) ? w * pr / 100 : null;
  const cost30 = protPack > 0 ? cur.p / protPack * 30 : null;
  const useK = cur.ppk != null;
  const cv = useK ? cur.ppk : cur.p;
  const pv = prior.map(e => useK ? e.ppk : e.p).filter(v => v != null);
  let real = null, med = null, low = false;
  if (pv.length && cv != null) { med = median(pv); real = (med - cv) / med * 100; low = pv.length >= 2 && cv <= Math.min(...pv); }
  const claimed = cur.o && cur.o > cur.p ? (cur.o - cur.p) / cur.o * 100 : null;
  const kcalPack = (w && k != null) ? w * k / 100 : null;
  return { cur, dens, protPack, cost30, real, med, n: pv.length, low, claimed, kcalPack };
}
function activeRows() {
  const latest = {};
  for (const x of Object.values(products)) if (!latest[x.store] || x.last > latest[x.store]) latest[x.store] = x.last;
  return Object.entries(products)
    .filter(([, x]) => x.history && x.history.length && x.last === latest[x.store])
    .map(([id, x]) => ({ id, x, c: calc(x) }));
}
function dietOk(x) {
  const t = x.tags || [];
  if (profile.diet === 'vegetarian') return !t.includes('carne') && !t.includes('pește');
  if (profile.diet === 'pescetarian') return !t.includes('carne');
  if (profile.diet === 'vegan') return !t.includes('carne') && !t.includes('pește') && !t.includes('lactate') && !t.includes('ouă');
  return true;
}
function exclOk(x) {
  const ws = String(profile.exclude || '').split(',').map(s => norm(s)).filter(Boolean);
  const n = norm(x.name + ' ' + (x.canonical || ''));
  return !ws.some(w => n.includes(w));
}
function score(r) { return r.c.dens != null ? r.c.dens / (r.c.cost30 || 15) : -1; }

/* ---------- date (Supabase) ---------- */
function mkCol() {
  return { doc: id => ({
    set: async data => { const { error } = await sb.from('docs').upsert({ user_id: uid, id, data, updated_at: new Date().toISOString() }); if (error) throw error; },
    delete: async () => { const { error } = await sb.from('docs').delete().eq('user_id', uid).eq('id', id); if (error) throw error; }
  }) };
}
async function shrink(blob) {
  try {
    const bmp = await createImageBitmap(blob), sc = Math.min(1, 1000 / bmp.width);
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    let o = await new Promise(r => c.toBlob(r, 'image/webp', 0.7));
    if (!o || o.type !== 'image/webp') o = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.7));
    return o && o.size < blob.size ? o : blob;
  } catch (e) { return blob; }
}
async function uploadPage(blob, name) {
  const b = await shrink(blob), ext = b.type === 'image/webp' ? 'webp' : 'jpg';
  const path = uid + '/' + norm(name).slice(0, 150) + '.' + ext;
  const { error } = await sb.storage.from('pages').upload(path, b, { contentType: b.type || 'image/jpeg', upsert: true, cacheControl: '31536000' });
  if (error) throw error;
  return path;

  $('#pSave').onclick = async () => {
    profile = { kcal: +$('#pKcal').value || DEF_PROFILE.kcal, protein: +$('#pProt').value || DEF_PROFILE.protein, diet: $('#pDiet').value, exclude: $('#pEx').value, minDensity: +$('#pMin').value || 0, budget: +$('#pBud').value || DEF_PROFILE.budget, days: +$('#pDays').value || 7 };
    await write(() => col.doc('profile').set(profile)); toast('Profil salvat');
  };
}

/* ---------- AI coș / rețete ---------- */
async function suggestBasket() {
  const btn = $('#sugBtn'); btn.disabled = true; btn.textContent = 'Se gândește…';
  try {
    const cand = activeRows().filter(r => dietOk(r.x) && exclOk(r.x) && r.c.dens != null && r.c.dens >= (profile.minDensity || 0))
      .sort((a, b) => score(b) - score(a)).slice(0, 45)
      .map(r => ({ id: r.id, nume: r.x.name, magazin: r.x.store, pret: r.c.cur.p, g: r.x.weight_g, kcal100: r.x.kcal100, prot100: r.x.protein100, lei_30g_prot: r.c.cost30 && +r.c.cost30.toFixed(2), reducere_reala_pct: r.c.real != null ? Math.round(r.c.real) : null }));
    if (!cand.length) { S.suggest = 'Nu ai oferte care trec filtrele din profil.'; viewBasket(); return; }
    const txt = await ask(`Alege un coș de cumpărături pentru ${profile.days} zile din ofertele de mai jos. Țintă zilnică: ${profile.kcal} kcal, ${profile.protein} g proteină. Stil: ${profile.diet}. Buget maxim: ${profile.budget} lei. Poți cumpăra doar din listă (nu e obligatoriu să acoperi tot necesarul). Preferă proteină multă la calorii puține, preț bun și reducere reală, variază sursele de proteină și nu lua mai mult de ce se poate consuma în ${profile.days} zile.
Răspunde STRICT cu JSON: {"ids":["id1","id2"],"note":"1-2 propoziții în română: ce acoperă coșul și ce lipsește"}
Oferte: ${JSON.stringify(cand)}`);
    const r = parseJson(txt);
    const ids = (r.ids || []).filter(i => products[i]);
    basket = [...new Set([...basket, ...ids])]; ids.forEach(i => { if (!bsnap[i]) bsnap[i] = snapOf(i); });
    S.suggest = r.note || '';
    await write(() => col.doc('basket').set({ items: basket, snap: bsnap }));
  } catch (e) { S.suggest = 'Eroare: ' + (e.message || e.code); }
  viewBasket();
}
async function makeRecipes() {
  const rows = basketRows().filter(r => catOf(r.x) === 'alimente');
  if (!rows.length) { toast('Coșul e gol'); return; }
  const btn = $('#recBtn'); btn.disabled = true; btn.textContent = 'Se generează…';
  try {
    const items = rows.map(r => `${r.x.name} (${r.x.weight_g || '?'} g, ${r.x.kcal100} kcal/100g, ${r.x.protein100} g prot/100g)`).join('\n');
    const txt = await ask(`Propune 4 rețete simple (max 30 min), bogate în proteină și slabe caloric, bazate în principal pe produsele din coș. Stil: ${profile.diet}. Țintă: ~${profile.kcal} kcal și ${profile.protein} g proteină pe zi. Ingrediente extra permise doar de bază (condimente, ulei puțin, legume obișnuite).
Răspunde STRICT cu JSON array: [{"titlu":"","portii":1,"kcal_portie":0,"proteina_portie":0,"ingrediente":["cantitate + ingredient"],"pasi":["..."]}], în română.
Coș:\n${items}`);
    const arr = parseJson(txt);
    S.recipes = arr.map(r => `<div class="recipe"><h3>${esc(r.titlu)}</h3><div class="muted">${esc(r.portii)} porții · ~${esc(r.kcal_portie)} kcal · ${esc(r.proteina_portie)} g proteină / porție</div>
      <ul>${(r.ingrediente || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul><ol>${(r.pasi || []).map(i => `<li>${esc(i)}</li>`).join('')}</ol></div>`).join('');
  } catch (e) { S.recipes = '<div class="warn">Eroare: ' + esc(e.message || e.code) + '</div>'; }
  viewBasket();
}

/* ---------- evenimente ---------- */
document.addEventListener('click', async e => {
  const nb = e.target.closest('#nav button');
  const gt = e.target.closest('[data-goto]');
  if (gt) { S.tab = gt.dataset.goto; render(); window.scrollTo(0, 0); return; }
  if (nb) { S.tab = nb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const ga = e.target.closest('[data-gact]');
  if (ga) {
    const gk = ga.dataset.gk, g = basketGroups().find(x => x.gk === gk); if (!g) return;
    if (ga.dataset.gact === 'copy') { try { await navigator.clipboard.writeText(listText(g)); toast('Lista a fost copiată'); } catch (er) { toast('Nu am putut copia'); } }
    else {
      if (!S.del['g' + gk]) { S.del['g' + gk] = true; viewBasket(); return; }
      delete S.del['g' + gk]; g.ids.forEach(id => delete bsnap[id]); basket = basket.filter(i => !g.ids.includes(i));
      write(() => col.doc('basket').set({ items: basket, snap: bsnap })); viewBasket();
    }
    return;
  }
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const card = btn.closest('[data-id]'); if (!card) return;
  const id = card.dataset.id, act = btn.dataset.act;
  if (act === 'basket') {
    const adding = !basket.includes(id);
    basket = adding ? [...basket, id] : basket.filter(i => i !== id);
    if (adding) bsnap[id] = snapOf(id); else delete bsnap[id];
    write(() => col.doc('basket').set({ items: basket, snap: bsnap }));
    if (adding && !favs.includes(id)) { favs = [...favs, id]; write(() => col.doc('favs').set({ ids: favs })); }
    if (S.tab === 'basket') viewBasket();
    else if (S.tab === 'catalog') { syncBasketBtns(id); const x = products[id]; if (x) toast((basket.includes(id) ? 'Adăugat: ' : 'Scos: ') + x.name); }
    else renderList();
  } else if (act === 'done') {
    { const cur = bsnap[id] || snapOf(id); if (cur) { bsnap[id] = { ...cur, done: !cur.done }; write(() => col.doc('basket').set({ items: basket, snap: bsnap })); viewBasket(); } }
  } else if (act === 'fav') {
    favs = favs.includes(id) ? favs.filter(i => i !== id) : [...favs, id];
    write(() => col.doc('favs').set({ ids: favs })); renderList();
  } else if (act === 'edit') { S.open[id] = !S.open[id]; renderList(); }
  else if (act === 'save') {
    const x = { ...products[id] }; card.querySelectorAll('[data-f]').forEach(i => { x[i.dataset.f] = num(i.value); });
    x.edited = true; x.est = false; products[id] = x; S.open[id] = false;
    await write(() => col.doc(id).set(x)); renderList(); toast('Salvat');
  } else if (act === 'del') {
    if (!S.del[id]) { S.del[id] = true; renderList(); return; }
    delete products[id]; basket = basket.filter(i => i !== id); delete S.del[id];
    await write(() => col.doc(id).delete()); renderList();
  }
});
function favAlert(ids) {
  const rows = ids.map(id => ({ id, x: products[id], c: calc(products[id]) })).sort((a, b) => (b.c.real || 0) - (a.c.real || 0));
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div><h3 style="margin:0 0 6px">🔔 ${rows.length} ${rows.length === 1 ? 'favorit e' : 'favorite sunt'} iar la reducere</h3>` +
    rows.map(r => `<div class="li"><div><div class="nm">${esc(r.x.name)}</div><div class="sub">${esc(r.x.store)} · ${f2(r.c.cur.p)} lei${r.c.cur.o ? ' (era ' + f2(r.c.cur.o) + ')' : ''}${r.c.real != null ? ' · ' + (r.c.real >= 0 ? '−' : '+') + Math.abs(Math.round(r.c.real)) + '% vs mediană' : ''}</div>${promoTag(r.x)}</div></div>`).join('') +
    `<div class="row" style="margin-top:12px"><button class="btn" id="mGo">Vezi în Oferte</button><button class="btn sec" id="mX">Închide</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mX').onclick = () => m.remove();
  m.querySelector('#mGo').onclick = () => { m.remove(); S.f.fav = true; S.tab = 'offers'; render(); };
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#installBtn').style.display = ''; });
window.addEventListener('appinstalled', () => { $('#installBtn').style.display = 'none'; deferredPrompt = null; toast('Aplicație instalată'); });
$('#installBtn').onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#installBtn').style.display = 'none'; };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
initDb();
</script>
